[workspace]
resolver = "2"
members = [
    "crates/pg-core",
    "crates/pg-sim",
    "server",
    "windows/agent",
    "windows/credprov",
    "tests/e2e",
]
exclude = ["windows/companion/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/simplehima/phonegate"

[workspace.dependencies]
pg-core = { path = "crates/pg-core" }
pg-sim = { path = "crates/pg-sim" }
pg-agent = { path = "windows/agent" }
phonegate-relay = { path = "server" }
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
aes-gcm = "0.10"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x509-parser = { version = "0.16", features = ["verify"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
axum = { version = "0.7", features = ["ws"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows = "0.58"
windows-service = "0.7"
rcgen = "0.13"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
