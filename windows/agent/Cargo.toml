[package]
name = "pg-agent"
description = "PhoneGate Windows agent (LocalSystem service): TPM keys, relay connection, approval engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "pg_agent"
path = "src/lib.rs"

[[bin]]
name = "phonegate-agent"
path = "src/main.rs"

[dependencies]
pg-core = { workspace = true, features = ["client"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
zeroize.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Authentication_Identity",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Memory",
] }

[dev-dependencies]
pg-sim.workspace = true
phonegate-relay.workspace = true
